; EasyPill V0 firmware
;
; Four targets. Pick with -e, e.g.  pio run -e bringup-c3 -t upload
;
;   bringup-c3 / bringup-s3   Interactive serial test harness. Flash this
;                             first. Exercises every mux channel, hall sensor,
;                             ADC channel, LED, buzzer and the latch, one
;                             keystroke at a time, over USB-CDC.
;
;   app-c3 / app-s3           The real thing: scheduler, web GUI, notifications.
;
; The board on the PCB is a XIAO ESP32-C3 (confirmed against the populated
; module), which is why default_envs is bringup-c3. The S3 envs are kept
; building so a second unit could use that module without a port; `pio run -t
; upload` prints "Chip is ESP32-C3" or "ESP32-S3" if you ever need to tell.
;
; MUX_C is U0TXD and SIG_OUT is U0RXD, so all logging is USB-CDC. Both board
; definitions already set ARDUINO_USB_MODE=1 and ARDUINO_USB_CDC_ON_BOOT=1.

[platformio]
default_envs = bringup-c3
src_dir = src
include_dir = include
lib_dir = lib

[common]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -Wall
    ; PlatformIO puts include/ on the path for src/ but NOT for libraries under
    ; lib/, and easypill_hw needs board_pins.h. Add it for the whole env.
    -I$PROJECT_INCLUDE_DIR
; ArduinoJson is the only external dependency in the whole project.
lib_deps = bblanchon/ArduinoJson@^7.2.0

; --- C3: 4 MB flash. min_spiffs leaves ~1.9 MB for the app and ~190 kB of
; --- LittleFS for the event log, which is plenty.
[c3]
board = seeed_xiao_esp32c3
board_build.partitions = min_spiffs.csv

; --- S3: 8 MB flash, the stock 8 MB table is already roomy.
[s3]
board = seeed_xiao_esp32s3

; =============================================================================
; Bring-up: serial test harness
; =============================================================================
[env:bringup-c3]
extends = common, c3
build_src_filter = +<bringup/>
build_flags = ${common.build_flags} -DEASYPILL_BRINGUP=1

[env:bringup-s3]
extends = common, s3
build_src_filter = +<bringup/>
build_flags = ${common.build_flags} -DEASYPILL_BRINGUP=1

; =============================================================================
; Application
; =============================================================================
[env:app-c3]
extends = common, c3
build_src_filter = +<app/>
extra_scripts =
    pre:tools/gen_web_assets.py
    pre:tools/gen_build_stamp.py

[env:app-s3]
extends = common, s3
build_src_filter = +<app/>
extra_scripts =
    pre:tools/gen_web_assets.py
    pre:tools/gen_build_stamp.py
