<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EasyPill">
<style>
.b{fill:#2d55c8}.l{fill:#dbe1e8}.d{fill:#ffffff}
@media (prefers-color-scheme:dark){.b{fill:#7f9ef7}.l{fill:#3b4653}.d{fill:#0e1216}}
</style>
<rect class="b" width="64" height="64" rx="14"/>
<!-- a 2x3 tray with one lid tipped open: reads as a pillbox even at 16 px -->
<g class="d">
<rect x="12" y="26" width="18" height="12" rx="2.5"/>
<rect x="34" y="26" width="18" height="12" rx="2.5"/>
<rect x="12" y="42" width="18" height="12" rx="2.5"/>
<rect x="34" y="42" width="18" height="12" rx="2.5"/>
</g>
<g class="l">
<rect x="34" y="22" width="18" height="5" rx="2.5"/>
<rect x="12" y="42" width="18" height="5" rx="2.5"/>
<rect x="34" y="42" width="18" height="5" rx="2.5"/>
<rect x="9.4" y="8.6" width="18" height="5" rx="2.5" transform="rotate(-38 18.4 11.1)"/>
</g>
</svg>
